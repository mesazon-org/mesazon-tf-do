name: schedule-gateway-db-sleep
on:
  schedule:
    # 22:00 UTC = 01:00 Athens time (EEST, UTC+3, summer), next calendar
    # day. Fixed offset - not DST-aware, so this will read as 00:00 local
    # once Greece switches back to EET (UTC+2) in late October.
    - cron: "0 22 * * *"
  workflow_dispatch: { }
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_do_token: ${{ secrets.DO_API_KEY }}
  TF_VAR_docker_token: ${{ secrets.DOCKER_TOKEN }}
jobs:
  teardown-configure:
    name: tear down gateway-postgres users/schema/firewall
    environment: dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesazon-clusters-configure/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get IP Addresses
        id: ip
        uses: candidob/get-runner-ip@v1.0.0
      - name: Export Runner IP as Environment Variable
        run: echo "TF_VAR_runner_ip=${{ steps.ip.outputs.ipv4 }}" >> $GITHUB_ENV
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.DO_SPACES_BUCKET }}" \
            -backend-config="key=mesazon-clusters-configure-dev-tf-state/terraform.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ secrets.DO_SPACES_REGION }}.digitaloceanspaces.com\"}"
      - name: Open firewall to runner (so teardown can reach Postgres)
        run: |
          terraform apply -auto-approve -input=false \
          -target=module.gateway_pg_configure.digitalocean_database_firewall.pg_firewall
      - name: Terraform destroy (users, schema, grants, firewall)
        run: terraform destroy -auto-approve -input=false

  sleep-cluster:
    name: destroy gateway-postgres cluster
    needs: [ teardown-configure ]
    environment: dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesazon-clusters/dev
    env:
      TF_VAR_project_id: "33eee19d-9b81-4846-b24f-c39bf70fe1f5"
      SPACES_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.DO_SPACES_BUCKET }}" \
            -backend-config="key=mesazon-clusters-dev-tf-state/terraform.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ secrets.DO_SPACES_REGION }}.digitaloceanspaces.com\"}"
      - name: Terraform apply (cluster_enabled=false)
        run: terraform apply -auto-approve -input=false -var="cluster_enabled=false"
