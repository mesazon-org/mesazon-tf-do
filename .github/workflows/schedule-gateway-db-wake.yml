name: schedule-gateway-db-wake
on:
  schedule:
    # 10:00 UTC = 13:00 Athens time (EEST, UTC+3, summer). Fixed offset -
    # not DST-aware, so this will read as 14:00 local once Greece switches
    # back to EET (UTC+2) in late October. Adjust the cron then if needed.
    - cron: "0 10 * * *"
  workflow_dispatch: { }
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  SPACES_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  SPACES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_do_token: ${{ secrets.DO_API_KEY }}
  TF_VAR_docker_token: ${{ secrets.DOCKER_TOKEN }}
  TF_VAR_project_id: "33eee19d-9b81-4846-b24f-c39bf70fe1f5"
jobs:
  wake-cluster:
    name: recreate gateway-postgres cluster
    environment: dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesazon-clusters/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.DO_SPACES_BUCKET }}" \
            -backend-config="key=mesazon-clusters-dev-tf-state/terraform.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ secrets.DO_SPACES_REGION }}.digitaloceanspaces.com\"}"
      - name: Terraform apply (cluster_enabled=true)
        run: terraform apply -auto-approve -input=false -var="cluster_enabled=true"

  configure-cluster:
    name: reconfigure gateway-postgres users/schema/firewall
    needs: [ wake-cluster ]
    uses: ./.github/workflows/job-tf-apply-firewall.yml
    secrets: inherit
    with:
      firewall-module: "module.gateway_pg_configure.digitalocean_database_firewall.pg_firewall"
      project-id: "" # Not used in mesazon-clusters-configure
      working-directory: "mesazon-clusters-configure/dev"
      module: "mesazon-clusters-configure-dev"
      environment: "dev"
