name: registry-retention-cleanup

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch: {}

jobs:
  prune-and-gc:
    runs-on: ubuntu-latest
    environment: prod # DO_API_KEY lives here, same as mesazon-shared's apply job
    env:
      KEEP: 10
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_KEY }}

      - name: Prune tags beyond retention limit
        run: |
          set -euo pipefail
          # -o json + jq, not --format/--no-header text parsing: doctl's
          # text output has proven unreliable at suppressing the header row
          # (it showed up as a fake repository named "Name"), so avoid it.
          mapfile -t repos < <(doctl registry repository list-v2 -o json | jq -r '.[].name')
          for repo in "${repos[@]}"; do
            echo "== $repo =="
            tags_json="$(doctl registry repository list-tags "$repo" -o json)"
            count="$(jq 'length' <<<"$tags_json")"
            if [ "$count" -gt "$KEEP" ]; then
              to_delete=$((count - KEEP))
              mapfile -t stale < <(jq -r 'sort_by(.updated_at) | .[].tag' <<<"$tags_json" | head -n "$to_delete")
              for tag in "${stale[@]}"; do
                echo "deleting $repo:$tag"
                doctl registry repository delete-tag "$repo" "$tag" --force
              done
            fi
          done

      - name: Reclaim space via garbage collection
        run: doctl registry garbage-collection start --include-untagged-manifests --force
